version: '3.8'
services:
  astro-static:
    image: nginx:alpine
    container_name: astro-static-site
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    driver: bridge